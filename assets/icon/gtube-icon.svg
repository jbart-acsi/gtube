<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- carrier: gtube's window background, as a rounded square -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#141312"/>
  <!-- four spectrum bars in gtube's accent, standing on a common floor at y=208 -->
  <rect x="36" y="104" width="38" height="104" rx="6" fill="#ff5c46"/>
  <rect x="86" y="64" width="38" height="144" rx="6" fill="#ff5c46"/>
  <rect x="136" y="128" width="38" height="80" rx="6" fill="#ff5c46"/>
  <rect x="186" y="88" width="38" height="120" rx="6" fill="#ff5c46"/>
  <!-- falling peak caps above each bar, in gtube's text colour -->
  <rect x="36" y="76" width="38" height="16" rx="5" fill="#eee8de"/>
  <rect x="86" y="36" width="38" height="16" rx="5" fill="#eee8de"/>
  <rect x="136" y="100" width="38" height="16" rx="5" fill="#eee8de"/>
  <rect x="186" y="60" width="38" height="16" rx="5" fill="#eee8de"/>
</svg>
